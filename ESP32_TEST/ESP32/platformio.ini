; СЕБАСТЬЯН — стендовый тест, СО-ПРОЦЕССОР (обычная ESP32, CH340)
; v6: + прошивка по Wi-Fi (env:esp32_ota внизу).
; v5: Bluetooth-колонка (A2DP) -> PCM5102A -> AUX, радио 433, тестовая мелодия,
; ARGB, 3 сенсора, кнопка мика, замер батареи, UART к S3.

[platformio]
extra_configs = secrets.ini       ; пароли отдельно (в .gitignore)
default_envs = esp32              ; Upload по умолчанию = только по проводу

[env:esp32]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; 2 слота по 1.9 МБ — нужно для прошивки по Wi-Fi (OTA)
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    sui77/rc-switch@^2.6.4
    https://github.com/pschatzmann/ESP32-A2DP/archive/refs/tags/v.1.7.5.zip

; ---------- прошивка ПО WI-FI ----------
; На экране головы: UPDATE > COPROC: WiFi OTA — дождись "COPROC: ZHDU <IP>" (лента фиолетовая).
; В VS Code внизу выбери env:esp32_ota, потом Upload. Есть 5 минут, потом плата сама вернётся в обычный режим.
[env:esp32_ota]
extends = env:esp32
upload_protocol = espota
upload_port = 192.168.1.187        ; <-- IP со-процессора с экрана (или sebastian-coproc.local)
; пароль OTA (--auth) лежит в secrets.ini — он не уходит на GitHub