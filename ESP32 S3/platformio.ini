; СЕБАСТЬЯН — стендовый тест, ГОЛОВА (ESP32-S3-N16R8)
; Дисплей+тач, SD+MP3 -> MAX98357A, микрофон INMP441, мьюты, UART к со-процессору.
; Заливать через порт "UART" на плате (как раньше, COM4).

[env:esp32s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    earlephilhower/ESP8266Audio@^1.9.7
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; ---------- TFT_eSPI: ST7789 240x320 + тач XPT2046 ----------
    -DUSER_SETUP_LOADED=1
    -DSUPPORT_TRANSACTIONS
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=16
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000