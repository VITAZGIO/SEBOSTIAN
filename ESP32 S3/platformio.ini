; СЕБАСТЬЯН — стендовый тест, ГОЛОВА (ESP32-S3-N16R8)
; Дисплей+тач, SD+MP3 -> MAX98357A, микрофон INMP441, мьюты, UART к со-процессору.
; Заливать через порт "UART" на плате (как раньше, COM4) — env:esp32s3.
; По Wi-Fi — env:esp32s3_ota (внизу): в IP впиши адрес с экрана UPDATE.

[platformio]
extra_configs = secrets.ini       ; пароли отдельно (в .gitignore)
default_envs = esp32s3              ; Upload по умолчанию = только по проводу

[env:esp32s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB        ; ВАЖНО: без этого загрузчик думает, что флеш 8 МБ, и крутится в перезагрузках
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv   ; 2 слота по 6.5 МБ — нужно для прошивки по Wi-Fi (OTA)
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    earlephilhower/ESP8266Audio@^1.9.7
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; ---------- TFT_eSPI: ST7789 240x320 + тач XPT2046 ----------
    -DUSER_SETUP_LOADED=1
    -DSUPPORT_TRANSACTIONS
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=16
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

; ---------- прошивка ПО WI-FI ----------
; В VS Code внизу (синяя полоска PlatformIO) выбери env:esp32s3_ota, потом Upload.
; На экране головы: UPDATE > HEAD: WiFi OTA — дождись "ZHDU <IP>".
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = 192.168.1.47        ; <-- IP головы с экрана (или sebastian-head.local)
; пароль OTA (--auth) лежит в secrets.ini — он не уходит на GitHub